# ackerdb local registry (Verdaccio). Start it with: bun run registry
# Storage and user file live next to this config and are gitignored —
# every published version is kept on disk, so old versions stay installable.
# 4874 on purpose: 4873 belongs to this machine's own Homebrew Verdaccio
# launchd agent (a general npm cache), which always wins that port at login.
listen: 127.0.0.1:4874
# npm publish base64-encodes the ~44 MB five-platform server tarball.
max_body_size: 100mb

storage: ./storage

web:
  title: ackerdb local registry

auth:
  htpasswd:
    file: ./htpasswd
    max_users: 100

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@ackerdb/*':
    # local-only: no proxy, so @ackerdb never leaks to / resolves from npmjs
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '**':
    access: $all
    proxy: npmjs

log:
  type: stdout
  format: pretty
  level: warn
