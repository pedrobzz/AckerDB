[package]
name = "ackerdb-webrtc"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-util = "=0.3.32"
libwebrtc = { path = ".cache/crates/libwebrtc" }
napi = { version = "=3.12.0", default-features = false, features = ["async", "compat-mode", "napi6"] }
napi-derive = "=3.6.1"
tokio = { version = "=1.49.0", features = ["sync", "time"] }

[build-dependencies]
napi-build = "=2.4.0"

[patch.crates-io]
webrtc-sys = { path = ".cache/crates/webrtc-sys" }
