# AckerDB production coturn baseline. Replace every REPLACE_* value.
listening-port=3478
tls-listening-port=443
fingerprint
realm=REPLACE_REALM
server-name=REPLACE_REALM

# If coturn is behind one-to-one NAT, use:
# external-ip=REPLACE_PUBLIC_IP/REPLACE_PRIVATE_IP

use-auth-secret
static-auth-secret=REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
stale-nonce=600

# TLS certificates must be readable only by the coturn service account.
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
no-tlsv1
no-tlsv1_1
no-dtls

# Keep the relay/firewall surface finite.
min-port=49160
max-port=49260

# Tune these from measured deployment capacity. Zero means unlimited and is
# intentionally not used in this production baseline.
user-quota=4
total-quota=1000
max-bps=10000000
bps-capacity=1000000000

# Do not make the relay an SSRF path into private infrastructure.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=100.100.100.200-100.100.100.200
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=168.63.129.16-168.63.129.16
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fec0::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Keep operational surfaces private. Never enable username labels with
# ephemeral REST credentials: coturn documents that as unbounded cardinality.
prometheus
prometheus-port=9641
prometheus-address=127.0.0.1
no-cli
no-software-attribute
no-tcp-relay

log-file=stdout
simple-log
