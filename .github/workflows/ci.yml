name: Pull request

on:
  pull_request:
    branches: [canary, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected work
    if: github.event.pull_request.draft == false && (github.base_ref == 'canary' || github.head_ref != 'canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test_packages: ${{ steps.changes.outputs.test_packages }}
      code: ${{ steps.changes.outputs.code }}
      native: ${{ steps.changes.outputs.native }}
      performance: ${{ steps.changes.outputs.performance }}
      telemetry: ${{ steps.changes.outputs.telemetry }}
      verify_packages: ${{ steps.changes.outputs.verify_packages }}
      mcp: ${{ steps.changes.outputs.mcp }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - id: changes
        run: >-
          bun scripts/ci/changes.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native.yml

  fast-ci:
    name: Fast CI
    if: always()
    needs: [changes, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate prerequisite jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          case "$CHANGES" in success|skipped) ;; *) exit 1 ;; esac
          case "$NATIVE" in success|skipped) ;; *) exit 1 ;; esac
      - if: needs.changes.result == 'success'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - if: needs.changes.result == 'success'
        uses: ./.github/actions/bun-workspace
      - name: Test affected packages
        if: needs.changes.result == 'success' && needs.changes.outputs.test_packages != '[]'
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: bun scripts/ci/test-affected.ts
      - name: Typecheck packages
        if: needs.changes.outputs.code == 'true'
        run: bun run typecheck
      - name: Check repository boundaries
        if: needs.changes.outputs.code == 'true'
        run: |
          bun test scripts/ci scripts/release
          bun test ./bench
          bun run typecheck:tooling
          bun run typecheck:bench
      - name: Audit production dependencies
        if: needs.changes.outputs.verify_packages == 'true'
        run: bun audit --prod
      - name: Check MCP conformance
        if: needs.changes.outputs.mcp == 'true'
        run: bun run test:mcp:conformance
      - name: Verify publishable packages
        if: needs.changes.outputs.verify_packages == 'true'
        run: bun run test:packages
      - name: Lint workflows
        if: needs.changes.outputs.workflows == 'true'
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Measure base and head
        if: needs.changes.outputs.performance == 'true'
        env:
          BENCH_EXECUTION_HOST: github-hosted
          BENCH_TELEMETRY_PROFILES: ${{ needs.changes.outputs.telemetry == 'true' && 'enabled,exporter,disabled' || 'disabled' }}
        run: >-
          bun bench/compare-commits.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          benchmark-results
      - name: Write the benchmark reasoning input
        if: needs.changes.outputs.performance == 'true'
        run: bun bench/report.ts benchmark-results/base.json benchmark-results/head.json | tee benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - if: needs.changes.outputs.performance == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-benchmark-${{ github.event.pull_request.head.sha }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30
