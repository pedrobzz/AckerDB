name: Pull request

on:
  pull_request:
    branches: [canary, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          URGENT: ${{ contains(github.event.pull_request.labels.*.name, 'release:urgent') }}
        run: >-
          bun scripts/ci/release-policy.ts
          "$BASE_BRANCH"
          "$HEAD_BRANCH"
          "$BASE_SHA"
          "$HEAD_SHA"
          "$PR_AUTHOR"
          "$URGENT"

  changes:
    name: Select affected work
    if: github.event.pull_request.draft == false && (github.base_ref == 'canary' || github.head_ref != 'canary')
    runs-on: ubuntu-24.04
    outputs:
      test_packages: ${{ steps.changes.outputs.test_packages }}
      native: ${{ steps.changes.outputs.native }}
      telemetry: ${{ steps.changes.outputs.telemetry }}
      verify_packages: ${{ steps.changes.outputs.verify_packages }}
      mcp: ${{ steps.changes.outputs.mcp }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: changes
        run: >-
          bun scripts/ci/changes.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  tests:
    name: Test ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.test_packages != '[]'
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.test_packages) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test ./packages/${{ matrix.package }}/test

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  extras:
    name: Repository boundaries
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test scripts/ci scripts/release
      - run: bun run typecheck:tooling
      - run: bun run typecheck:bench
      - if: needs.changes.outputs.mcp == 'true'
        run: bun run test:mcp:conformance
      - if: needs.changes.outputs.verify_packages == 'true'
        run: bun run test:packages
      - if: needs.changes.outputs.workflows == 'true'
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native.yml

  complete:
    name: Fast CI
    if: always()
    needs: [policy, changes, tests, typecheck, extras, native]
    runs-on: ubuntu-24.04
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          EXTRAS: ${{ needs.extras.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          for result in "$POLICY" "$CHANGES" "$TESTS" "$TYPECHECK" "$EXTRAS" "$NATIVE"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
