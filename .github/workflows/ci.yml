name: Pull request

on:
  pull_request:
    branches: [canary, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected work
    if: github.event.pull_request.draft == false && (github.base_ref == 'canary' || github.base_ref == 'main' || github.head_ref != 'canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test_packages: ${{ steps.changes.outputs.test_packages }}
      code: ${{ steps.changes.outputs.code }}
      native_build: ${{ steps.changes.outputs.native_build }}
      native_tests: ${{ steps.changes.outputs.native_tests }}
      verify_packages: ${{ steps.changes.outputs.verify_packages }}
      mcp: ${{ steps.changes.outputs.mcp }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - id: changes
        run: >-
          bun scripts/ci/changes.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  native_build:
    name: Native build
    needs: changes
    if: needs.changes.outputs.native_build == 'true'
    uses: ./.github/workflows/native.yml

  native_tests:
    name: Native tests
    needs: changes
    if: >-
      needs.changes.outputs.native_tests == 'true' &&
      needs.changes.outputs.native_build != 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/bun-workspace
      - name: Reuse verified WebRTC binaries
        run: >-
          bun -e 'import { ensureNativeArtifacts } from
          "./scripts/release/native-artifacts.ts";
          await ensureNativeArtifacts(["https://registry.npmjs.org"])'
      - run: >-
          bun test --timeout 15000
          packages/realtime/native/webrtc/test/native-engine.test.ts
          packages/realtime/native/webrtc/test/public-session.test.ts

  fast-ci:
    name: Fast CI
    if: always()
    needs: [changes, native_build, native_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate prerequisite jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE_BUILD: ${{ needs.native_build.result }}
          NATIVE_TESTS: ${{ needs.native_tests.result }}
        run: |
          case "$CHANGES" in success|skipped) ;; *) exit 1 ;; esac
          case "$NATIVE_BUILD" in success|skipped) ;; *) exit 1 ;; esac
          case "$NATIVE_TESTS" in success|skipped) ;; *) exit 1 ;; esac
      - if: needs.changes.result == 'success'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - if: needs.changes.result == 'success'
        uses: ./.github/actions/bun-workspace
      - name: Test affected packages
        if: needs.changes.result == 'success' && needs.changes.outputs.test_packages != '[]'
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: bun scripts/ci/test-affected.ts
      - name: Typecheck packages
        if: needs.changes.outputs.code == 'true'
        run: bun run typecheck
      - name: Check repository boundaries
        if: needs.changes.outputs.code == 'true'
        run: |
          bun test ./scripts/ci ./scripts/release
          bun run typecheck:tooling
      - name: Audit production dependencies
        if: needs.changes.outputs.verify_packages == 'true'
        run: bun scripts/ci/audit-production.ts
      - name: Check MCP conformance
        if: needs.changes.outputs.mcp == 'true'
        run: bun run test:mcp:conformance
      - name: Verify publishable packages
        if: needs.changes.outputs.verify_packages == 'true'
        run: bun run test:packages
      - name: Lint workflows
        if: needs.changes.outputs.workflows == 'true'
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
