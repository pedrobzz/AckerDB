name: Pull request

on:
  pull_request:
    branches: [canary, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected work
    if: github.event.pull_request.draft == false && (github.base_ref == 'canary' || github.head_ref != 'canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test_packages: ${{ steps.changes.outputs.test_packages }}
      code: ${{ steps.changes.outputs.code }}
      native: ${{ steps.changes.outputs.native }}
      performance: ${{ steps.changes.outputs.performance }}
      telemetry: ${{ steps.changes.outputs.telemetry }}
      verify_packages: ${{ steps.changes.outputs.verify_packages }}
      mcp: ${{ steps.changes.outputs.mcp }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - id: changes
        run: >-
          bun scripts/ci/changes.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  tests:
    name: Test ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.test_packages != '[]'
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.test_packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/bun-workspace
      - run: bun test ./packages/${{ matrix.package }}/test

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/bun-workspace
      - run: bun run typecheck

  extras:
    name: Repository boundaries
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/bun-workspace
      - run: bun test scripts/ci scripts/release
      - run: bun run typecheck:tooling
      - run: bun run typecheck:bench
      - if: needs.changes.outputs.mcp == 'true'
        run: bun run test:mcp:conformance
      - if: needs.changes.outputs.verify_packages == 'true'
        run: bun run test:packages
      - if: needs.changes.outputs.workflows == 'true'
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native.yml

  benchmark:
    name: Paired Hetzner samples
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: [self-hosted, linux, x64, ackerdb-benchmark]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Measure base and head
        env:
          BENCH_EXECUTION_HOST: hetzner
          BENCH_TELEMETRY_PROFILES: ${{ needs.changes.outputs.telemetry == 'true' && 'enabled,exporter,disabled' || 'disabled' }}
        run: >-
          bun bench/compare-commits.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          benchmark-results
      - name: Write the reasoning input
        run: bun bench/report.ts benchmark-results/base.json benchmark-results/head.json | tee benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-benchmark-${{ github.event.pull_request.head.sha }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30

  complete:
    name: Fast CI
    if: always()
    needs: [changes, tests, typecheck, extras, native, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          EXTRAS: ${{ needs.extras.result }}
          NATIVE: ${{ needs.native.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
        run: |
          for result in "$CHANGES" "$TESTS" "$TYPECHECK" "$EXTRAS" "$NATIVE" "$BENCHMARK"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
