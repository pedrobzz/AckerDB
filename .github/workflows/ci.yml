name: Pull request

on:
  pull_request:
    branches: [canary, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected work
    # Both roads select work. `Benchmark` reads `performance` on the way into
    # `canary` and again on the promotion, so a regression is attributable to
    # one pull request first and to the release second.
    if: github.event.pull_request.draft == false && (github.base_ref == 'canary' || github.base_ref == 'main' || github.head_ref != 'canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test_packages: ${{ steps.changes.outputs.test_packages }}
      code: ${{ steps.changes.outputs.code }}
      native_build: ${{ steps.changes.outputs.native_build }}
      native_tests: ${{ steps.changes.outputs.native_tests }}
      performance: ${{ steps.changes.outputs.performance }}
      verify_packages: ${{ steps.changes.outputs.verify_packages }}
      mcp: ${{ steps.changes.outputs.mcp }}
      workflows: ${{ steps.changes.outputs.workflows }}
      website: ${{ steps.changes.outputs.website }}
      promotion: ${{ github.base_ref == 'main' && github.head_ref == 'canary' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - id: changes
        run: >-
          bun scripts/ci/changes.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  native_build:
    name: Native build
    needs: changes
    if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.native_build == 'true'
    uses: ./.github/workflows/native.yml

  native_tests:
    name: Native tests
    needs: changes
    if: >-
      needs.changes.outputs.promotion != 'true' &&
      needs.changes.outputs.native_tests == 'true' &&
      needs.changes.outputs.native_build != 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/bun-workspace
      - name: Reuse verified WebRTC binaries
        run: >-
          bun -e 'import { ensureNativeArtifacts } from
          "./scripts/release/native-artifacts.ts";
          await ensureNativeArtifacts(["https://registry.npmjs.org"])'
      - run: >-
          bun test --timeout 15000
          packages/realtime/native/webrtc/test/native-engine.test.ts
          packages/realtime/native/webrtc/test/public-session.test.ts

  fast-ci:
    name: Fast CI
    if: always()
    needs: [changes, native_build, native_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate prerequisite jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE_BUILD: ${{ needs.native_build.result }}
          NATIVE_TESTS: ${{ needs.native_tests.result }}
        run: |
          case "$CHANGES" in success|skipped) ;; *) exit 1 ;; esac
          case "$NATIVE_BUILD" in success|skipped) ;; *) exit 1 ;; esac
          case "$NATIVE_TESTS" in success|skipped) ;; *) exit 1 ;; esac
      - if: needs.changes.outputs.promotion != 'true' && needs.changes.result == 'success'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.promotion != 'true' && needs.changes.result == 'success'
        uses: ./.github/actions/bun-workspace
      - name: Test affected packages
        if: needs.changes.outputs.promotion != 'true' && needs.changes.result == 'success' && needs.changes.outputs.test_packages != '[]'
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: bun scripts/ci/test-affected.ts
      - name: Typecheck packages
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.code == 'true'
        run: bun run typecheck
      - name: Check repository boundaries
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.code == 'true'
        run: |
          bun test ./scripts/ci ./scripts/release
          bun test ./bench
          bun run typecheck:tooling
          bun run typecheck:bench
      - name: Audit production dependencies
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.verify_packages == 'true'
        run: bun scripts/ci/audit-production.ts
      - name: Check MCP conformance
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.mcp == 'true'
        run: bun run test:mcp:conformance
      - name: Verify publishable packages
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.verify_packages == 'true'
        run: bun run test:packages
      - name: Lint workflows
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.workflows == 'true'
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
      - name: Install website dependencies
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.website == 'true'
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Install website browser
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.website == 'true'
        working-directory: website
        run: bunx playwright install --with-deps chromium
      - name: Verify website
        if: needs.changes.outputs.promotion != 'true' && needs.changes.outputs.website == 'true'
        working-directory: website
        run: bun run verify

  # The benchmark gates every pull request that touches a measured input,
  # because a regression is only cheap to fix while it still belongs to one
  # change. It used to run on the `canary` → `main` promotion alone, which meant
  # `Benchmark ✅` on a pull request into `canary` was a two-second no-op — and a
  # branch that cost most of the framework's throughput reached a clean review
  # with that green tick beside it. The release delta is a real measurement, but
  # it arrives at the one moment when attributing it costs the whole cycle, so
  # the same comparison now runs on the way in as well as on the way out.
  #
  # `always()` with the prerequisite gate below mirrors Fast CI: a required check
  # must report a conclusion even when it has nothing to measure, or a pull
  # request touching no performance-relevant input would sit pending forever.
  benchmark:
    name: Benchmark
    if: always()
    needs: [changes, native_build]
    runs-on: ubuntu-24.04
    # The cap is finite so a hung process cannot retain a runner indefinitely.
    timeout-minutes: 25
    steps:
      - name: Validate prerequisite jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE_BUILD: ${{ needs.native_build.result }}
        run: |
          case "$CHANGES" in success|skipped) ;; *) exit 1 ;; esac
          case "$NATIVE_BUILD" in success|skipped) ;; *) exit 1 ;; esac
      - if: needs.changes.outputs.performance == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.performance == 'true'
        uses: ./.github/actions/bun-workspace
      - name: Measure both commits, interleaved
        if: needs.changes.outputs.performance == 'true'
        env:
          BENCH_EXECUTION_HOST: github-hosted
        run: >-
          bun bench/compare-commits.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          benchmark-results
      # `shell: bash` is load-bearing: it turns on `pipefail`, without which the
      # pipeline's exit code would be `tee`'s and a reported regression would
      # leave the check green.
      - name: Read the comparison and decide
        if: needs.changes.outputs.performance == 'true'
        shell: bash
        run: bun bench/report.ts benchmark-results | tee benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      # Uploaded even when the comparison failed: the numbers that failed it are
      # the ones worth reading.
      - if: always() && needs.changes.outputs.performance == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-benchmark-${{ github.event.pull_request.head.sha }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30
