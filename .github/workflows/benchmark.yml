name: AckerDB benchmark

on:
  pull_request:
    branches: [canary, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    name: Benchmark scope
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
      telemetry: ${{ steps.changes.outputs.telemetry }}
    steps:
      - id: scope
        env:
          BASE: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$DRAFT" != true ] && { [ "$BASE" = canary ] || [ "$HEAD" != canary ]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: steps.scope.outputs.run == 'true'
        id: changes
        run: >-
          bun scripts/ci/changes.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  run:
    name: Paired Hetzner samples
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: [self-hosted, linux, x64, ackerdb-benchmark]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Measure base and head
        env:
          BENCH_EXECUTION_HOST: hetzner
          BENCH_TELEMETRY_PROFILES: ${{ needs.decide.outputs.telemetry == 'true' && 'enabled,exporter,disabled' || 'disabled' }}
        run: >-
          bun bench/compare-commits.ts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          benchmark-results
      - name: Write the reasoning input
        run: bun bench/report.ts benchmark-results/base.json benchmark-results/head.json | tee benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-benchmark-${{ github.event.pull_request.head.sha }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30

  complete:
    name: AckerDB benchmark
    if: always()
    needs: [decide, run]
    runs-on: ubuntu-24.04
    steps:
      - env:
          REQUIRED: ${{ needs.decide.outputs.run }}
          RESULT: ${{ needs.run.result }}
        run: |
          if [ "$REQUIRED" = true ] && [ "$RESULT" != success ]; then
            exit 1
          fi
