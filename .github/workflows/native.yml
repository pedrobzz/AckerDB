name: Native packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Native policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-deny*
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-rust-1.94.0-v0.20.2
      - if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - run: >-
          cargo deny --manifest-path packages/realtime/native/webrtc/Cargo.toml
          --config packages/realtime/native/webrtc/deny.toml --locked
          check advisories licenses sources

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            platform_arch_abi: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            platform_arch_abi: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            platform_arch_abi: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64
            platform_arch_abi: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: win32-x64
            platform_arch_abi: win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
      - name: Restore Cargo and native build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-about*
            ~/.cargo/bin/cargo-cyclonedx*
            packages/realtime/native/webrtc/target
          key: webrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/realtime/native/webrtc/Cargo.lock', 'packages/realtime/native/webrtc/src/**', 'packages/realtime/native/webrtc/build.rs') }}
          restore-keys: webrtc-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-dev
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install evidence tools when absent
        shell: bash
        run: |
          command -v cargo-cyclonedx >/dev/null || cargo install --locked cargo-cyclonedx --version 0.5.9
          command -v cargo-about >/dev/null || cargo install --locked cargo-about --version 0.9.1 --features cli
      - run: bun run build:webrtc
      - name: Verify generated loader
        shell: bash
        run: |
          git ls-files --error-unmatch packages/realtime/native/webrtc/binding/index.cjs packages/realtime/native/webrtc/binding/index.d.cts
          git diff --exit-code -- packages/realtime/native/webrtc/binding/index.cjs packages/realtime/native/webrtc/binding/index.d.cts
      - name: Execute native runtime tests
        if: matrix.target == 'darwin-arm64'
        run: bun test packages/realtime/native/webrtc/test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webrtc-${{ matrix.target }}
          path: |
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.node
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.manifest.json
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.sbom.cdx.json
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.THIRD_PARTY_NOTICES.txt
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.PROVENANCE.md
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.licenses/**
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Verify exact native packages
    needs: [policy, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: webrtc-*
          path: packages/realtime/native/webrtc/binding
          merge-multiple: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run pack:webrtc-candidate
      - run: bun run verify:webrtc-candidate
      - run: >-
          ACKERDB_RELEASE_CANDIDATE="$GITHUB_WORKSPACE/dist/webrtc-candidate/webrtc-candidate-manifest.json"
          bun run test:packages:webrtc
