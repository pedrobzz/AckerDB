name: WebRTC native packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/webrtc-prebuilds.yml"
      - "package.json"
      - "bun.lock"
      - "packages/core/**"
      - "packages/server/**"
      - "packages/cache/**"
      - "packages/client/**"
      - "packages/client-react/**"
      - "packages/cli/**"
      - "packages/realtime/native/**"
      - "packages/realtime-native/**"
      - "packages/realtime/**"
      - "scripts/lib.ts"
      - "scripts/packed-consumer.ts"
      - "scripts/publish-local.ts"
      - "scripts/verify-packages.ts"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: webrtc-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Verify native dependency and workflow policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
      - run: bun install --frozen-lockfile
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: >-
          cargo deny --manifest-path packages/realtime/native/webrtc/Cargo.toml
          --config packages/realtime/native/webrtc/deny.toml --locked
          check advisories licenses sources
      - run: bun audit --prod
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  build:
    name: Build ${{ matrix.target }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform_arch_abi: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            platform_arch_abi: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            platform_arch_abi: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64
            platform_arch_abi: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: win32-x64
            platform_arch_abi: win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
      - name: Install upstream Linux header dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-dev
      - run: bun install --frozen-lockfile
      - run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - run: cargo install --locked cargo-about --version 0.9.1 --features cli
      - run: bun run build:webrtc
      - name: Verify committed generated binding
        run: |
          git ls-files --error-unmatch packages/realtime/native/webrtc/binding/index.cjs packages/realtime/native/webrtc/binding/index.d.cts
          git diff --exit-code -- packages/realtime/native/webrtc/binding/index.cjs packages/realtime/native/webrtc/binding/index.d.cts
      - name: Execute native suite on the supported runtime-test target
        if: matrix.target == 'darwin-arm64'
        run: bun test packages/realtime/native/webrtc/test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webrtc-${{ matrix.target }}
          path: |
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.node
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.manifest.json
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.sbom.cdx.json
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.THIRD_PARTY_NOTICES.txt
            packages/realtime/native/webrtc/binding/ackerdb_webrtc.${{ matrix.platform_arch_abi }}.licenses/**
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and attest exact native packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: webrtc-*
          path: packages/realtime/native/webrtc/binding
          merge-multiple: true
      - run: bun install --frozen-lockfile
      - run: bun run pack:webrtc-candidate
      - run: bun run verify:webrtc-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-candidate-under-test
          path: dist/webrtc-candidate
          if-no-files-found: error
          retention-days: 1

  test-package-darwin:
    name: Execute the exact assembled package on Darwin arm64
    needs: assemble
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ackerdb-candidate-under-test
          path: dist/webrtc-candidate
      - run: bun install --frozen-lockfile
      - run: bun run verify:webrtc-candidate
      - run: >-
          ACKERDB_RELEASE_CANDIDATE="$GITHUB_WORKSPACE/dist/webrtc-candidate/webrtc-candidate-manifest.json"
          bun run test:packages:webrtc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-release-candidate
          path: dist/webrtc-candidate
          if-no-files-found: error
          retention-days: 14
