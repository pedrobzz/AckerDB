name: WebRTC prebuilds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/webrtc-prebuilds.yml"
      - "packages/realtime/native/**"
      - "packages/realtime/src/native/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
      - name: Install upstream Linux header dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-dev
      - run: bun install --frozen-lockfile
      - run: bun run build:webrtc
      - name: Execute native suite on the supported runtime-test target
        if: matrix.target == 'darwin-arm64'
        run: bun test packages/realtime/native/webrtc/test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webrtc-${{ matrix.target }}
          path: packages/realtime/native/webrtc/prebuilds/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble exact realtime package
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: webrtc-*
          path: packages/realtime/native/webrtc/prebuilds
      - name: Normalize target directories
        shell: bash
        run: |
          set -euo pipefail
          for artifact in packages/realtime/native/webrtc/prebuilds/webrtc-*; do
            target="${artifact##*/webrtc-}"
            mkdir -p "packages/realtime/native/webrtc/prebuilds/$target"
            mv "$artifact/ackerdb_webrtc.node" \
              "$artifact/manifest.json" \
              "packages/realtime/native/webrtc/prebuilds/$target/"
            rmdir "$artifact"
          done
      - run: bun run assemble:webrtc
      - name: Pack and verify the published file boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          package="$(cd packages/realtime && bun pm pack --destination ../../dist --quiet)"
          package="dist/${package##*/}"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            tar -tf "$package" |
              grep -Fx "package/native/webrtc/prebuilds/$target/ackerdb_webrtc.node"
            tar -tf "$package" |
              grep -Fx "package/native/webrtc/prebuilds/$target/manifest.json"
          done
          tar -tf "$package" |
            grep -Fx "package/native/webrtc/prebuilds/manifest.json"
          tar -tf "$package" |
            grep -Fx "package/native/webrtc/prebuilds/sbom.spdx.json"
          tar -tf "$package" |
            grep -Fx "package/native/webrtc/prebuilds/THIRD_PARTY_NOTICES.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ackerdb-realtime-with-webrtc-prebuilds
          path: |
            packages/realtime/native/webrtc/prebuilds
            dist
          if-no-files-found: error
          retention-days: 14

  test-package-darwin:
    name: Execute the exact assembled package on Darwin arm64
    needs: assemble
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ackerdb-realtime-with-webrtc-prebuilds
          path: .
      - run: bun install --frozen-lockfile
      - run: bun run assemble:webrtc
      - run: bun run test:packages:webrtc
