name: Publish npm

on:
  push:
    branches: [canary, main]

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: github.event.created != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require staged-publishing support
        run: >-
          node -e 'const version = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 15)) throw new Error(`npm ${version} cannot stage packages`)'
      - name: Find native artifacts from the merged PR
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr=$(gh api "repos/$REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | first | .number // empty')
          [ -n "$pr" ] || exit 0
          head_sha=$(gh api "repos/$REPOSITORY/pulls/$pr" --jq .head.sha)
          run_id=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head_sha&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          [ -n "$run_id" ] || exit 0
          count=$(gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name | startswith("webrtc-"))] | length')
          if [ "$count" -eq 5 ]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.native.outputs.run_id }}
          pattern: webrtc-*
          path: packages/realtime/native/webrtc/binding
          merge-multiple: true
      - id: stage
        run: bun scripts/release/publish.ts npm
      - run: echo "Staged @ackerdb/*@${{ steps.stage.outputs.version }} for Pedro's 2FA approval" >> "$GITHUB_STEP_SUMMARY"
