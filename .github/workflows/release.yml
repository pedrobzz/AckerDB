name: Publish npm

on:
  workflow_dispatch:
  push:
    branches: [canary, main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  approve-stable:
    name: Approve stable
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm-stable-approval
    steps:
      - run: echo "Stable publication approved" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ github.ref_name }}
    needs: approve-stable
    if: >-
      always() && github.event.created != true &&
      (needs.approve-stable.result == 'success' || needs.approve-stable.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require trusted-publishing support
        run: >-
          node -e 'const version = require("node:child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) throw new Error("npm " + version + " cannot use trusted publishing")'
      - id: publish
        run: bun scripts/release/publish.ts npm
      - run: echo "Published @ackerdb/*@${{ steps.publish.outputs.version }} from protected ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
